<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <form action="">
        <!-- Input de texto -->
        <label for="username">Nome</label>
        <input name="username" type="text" placeholder="Insira seu nome">

        <label for="email">Email</label>
        <input type="email" name="email" id="" placeholder="Insira seu email">

        <label for="password">Senha</label>
        <input type="password" name="password" id="" placeholder="Insira sua senha">

        <label for="interesse">Interesses</label>
        <input type="checkbox" name="interesse" id="" value="html">HTML
        <input type="checkbox" name="interesse" id="" value="javascript">JS
        <input type="checkbox" name="interesse" id="" value="CSS">CSS

        <label for="genero">Genero</label>
        <input type="radio" name="genero" id="" value="masculino">Masculino
        <input type="radio" name="genero" id="" value="feminino">Feminino
        <input type="radio" name="genero" id="" value="nao-binario">Não Binário
        <input type="radio" name="genero" id="" value="nao-informado">Prefiro Não Informar

        <label for="curso">Curso</label>
        <select name="curso" id="">
            <option value="javascript">JavaScript</option>
            <option value="html">Html</option>
            <option value="css">Css</option>
            <select name="" id=""></select>
        </select>

        <label for="comentario">Comentario</label>
        <textarea name="comentario" id="" cols="30" rows="5" placeholder="Insira seu comentario"></textarea>

        <button type="submit">Enviar</button>
    </form>
</body>

</html>
