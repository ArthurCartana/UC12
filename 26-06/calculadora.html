<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="assets/styles/calculadora.css">
    <link rel="shortcut icon" href="assets/images/rocket.png" type="image/x-icon">
</head>

<body>
    <div class="base">

        <div class="visor">
            <h1>0</h1>
        </div>

        <div class="numeros">
            <button class="numero" id="btn1">1</button>
            <button class="numero" id="btn2">2</button>
            <button class="numero" id="btn3">3</button>
            <button class="clear" id="btnC">C</button>
            <button class="numero" id="btn4">4</button>
            <button class="numero" id="btn5">5</button>
            <button class="numero" id="btn6">6</button>
            <button class="vezes" id="btn*">*</button>
            <button class="numero" id="btn7">7</button>
            <button class="numero" id="btn8">8</button>
            <button class="numero" id="btn9">9</button>
            <button class="dividir" id="btn/">/</button>
            <button class="numero" id="btn0">0</button>
            <button class="mais" id="btn+">+</button>
            <button class="menos" id="btn-">-</button>
            <button class="igual" id="btn=">=</button>

        </div>

    </div>

    <script src="assets/scripts/calculadora.js"></script>
</body>

</html>
