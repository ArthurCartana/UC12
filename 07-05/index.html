<!DOCTYPE html>
<!--
    lang indica a linguagem da página
-->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- tittle mostra o título da página no navegador -->
    <title>Minha página</title>
    <link rel="stylesheet" href="assets/styles/index.css">
</head>
<!-- body é a tag que envolve tudo que aparece na minha página -->

<body>
    <h1>Notícias</h1>
    <hr>

    <h2>Vencedor da bola de ouro é anunciado</h2>
    <p>Na tarde de hoje,<br> CR7 ganhou o prêmio de melhor do mundo!</p>
    <h3>Ele ganha a sua quinta abola de ouro</h3>

    <hr>
    <h2
    class = "fundo-cinza">Cristiano Ronaldo</h2>

    <!-- a é a tag de link -->
    <!-- toda tag tem propriedades. São os itens em amarelo -->
    <a href="http://www.youtube.com" target="_blank">Clique aqui</a>

    <!-- img é a tag de imagem -->
    <!-- src é onde colocamos o link da imagem -->
    <!-- alt é o texto curto descritivo da imagem -->

    <!-- Usando imagem via link -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Cristiano_Ronaldo_20120609.jpg/250px-Cristiano_Ronaldo_20120609.jpg"
        alt="Melhor do Mundo">

    <!-- Usando uma imagem salva no projeto -->
    <img src="assets/images/cristiano-ronaldo-no-manchester-united.jpg" alt="Melhor do Mundo">

    <!-- ul é a tag de lista não ordenada -->
    <ul>
        <!-- li é a tag que representa cada item da lista-->
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <!-- ol é a tag de lista ordenada -->
    <ol>
        <li>Item</li>
        <li>Outro item</li>
        <li>Mais um item</li>
    </ol>

    <!-- button é a tag de botão -->
    <button>Clique aqui</button>


</body>

</html>
